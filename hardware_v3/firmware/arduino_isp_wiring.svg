<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Arduino Uno as ISP - ATtiny85 wiring (BRD170127 R2 and V3)</title>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1d2733">Arduino Uno as ISP → ATtiny85 (U1)</text>
  <text x="500" y="58" font-size="14" text-anchor="middle" fill="#4a5563">Same wiring for rev R2 and rev V3. On V3, clip onto U1 on the board (SOIC-8 test clip); on R2 kits, a SOIC-8 ZIF adapter was used.</text>

  <!-- Arduino Uno block -->
  <rect x="60" y="100" width="300" height="380" rx="14" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2.5"/>
  <text x="210" y="132" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f5f8b">Arduino Uno</text>
  <text x="210" y="154" font-size="13" text-anchor="middle" fill="#1f5f8b">running File → Examples → 11.ArduinoISP</text>

  <!-- Uno pins (right edge) -->
  <g font-size="15" fill="#1d2733">
    <text x="330" y="200" text-anchor="end">D10</text>
    <text x="330" y="250" text-anchor="end">D11</text>
    <text x="330" y="300" text-anchor="end">D12</text>
    <text x="330" y="350" text-anchor="end">D13</text>
    <text x="330" y="400" text-anchor="end">5V</text>
    <text x="330" y="450" text-anchor="end">GND</text>
  </g>
  <g fill="#1f5f8b">
    <circle cx="360" cy="195" r="6"/><circle cx="360" cy="245" r="6"/><circle cx="360" cy="295" r="6"/>
    <circle cx="360" cy="345" r="6"/><circle cx="360" cy="395" r="6"/><circle cx="360" cy="445" r="6"/>
  </g>

  <!-- 10uF reset cap on Uno -->
  <g transform="translate(90,190)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#8b1f1f">10 µF</text>
    <text x="0" y="18" font-size="12" fill="#8b1f1f">Uno RESET (+) → GND (−)</text>
    <text x="0" y="34" font-size="12" fill="#8b1f1f">fit AFTER uploading</text>
    <text x="0" y="50" font-size="12" fill="#8b1f1f">ArduinoISP; stops the</text>
    <text x="0" y="66" font-size="12" fill="#8b1f1f">Uno resetting when</text>
    <text x="0" y="82" font-size="12" fill="#8b1f1f">avrdude connects</text>
  </g>
  <g transform="translate(90,300)" font-size="12" fill="#4a5563">
    <text x="0" y="0" font-weight="bold">Optional status LEDs</text>
    <text x="0" y="17">(each with ~1 kΩ to GND)</text>
    <text x="0" y="34">D9 heartbeat</text>
    <text x="0" y="51">D8 error</text>
    <text x="0" y="68">D7 programming</text>
  </g>

  <!-- ATtiny85 SOIC-8 top view -->
  <rect x="610" y="170" width="150" height="250" rx="6" fill="#2b2f36" stroke="#111" stroke-width="2"/>
  <circle cx="632" cy="192" r="7" fill="#9aa3ad"/>
  <text x="685" y="300" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff" transform="rotate(-90 685 300)">ATtiny85V-10SU</text>
  <text x="685" y="446" font-size="13" text-anchor="middle" fill="#4a5563">top view, pin 1 at the dot</text>
  <!-- left pins 1-4 -->
  <g fill="#c9ced6" stroke="#666">
    <rect x="590" y="190" width="20" height="16"/><rect x="590" y="250" width="20" height="16"/>
    <rect x="590" y="310" width="20" height="16"/><rect x="590" y="370" width="20" height="16"/>
    <rect x="760" y="190" width="20" height="16"/><rect x="760" y="250" width="20" height="16"/>
    <rect x="760" y="310" width="20" height="16"/><rect x="760" y="370" width="20" height="16"/>
  </g>
  <g font-size="13" fill="#ffffff">
    <text x="618" y="203">1</text><text x="618" y="263">2</text><text x="618" y="323">3</text><text x="618" y="383">4</text>
    <text x="742" y="203">8</text><text x="742" y="263">7</text><text x="742" y="323">6</text><text x="742" y="383">5</text>
  </g>
  <g font-size="13" fill="#1d2733">
    <text x="585" y="185" text-anchor="end">PB5 RESET</text>
    <text x="585" y="245" text-anchor="end">PB3 XTAL1</text>
    <text x="585" y="305" text-anchor="end">PB4 XTAL2</text>
    <text x="585" y="365" text-anchor="end">GND</text>
    <text x="810" y="184">VCC</text>
    <text x="786" y="244">PB2 SCK</text>
    <text x="786" y="231" font-size="11" fill="#4a5563">V3 BATT_EN · R2 mode pin</text>
    <text x="786" y="304">PB1 MISO</text>
    <text x="786" y="291" font-size="11" fill="#4a5563">DTMF PWM</text>
    <text x="786" y="364">PB0 MOSI</text>
    <text x="786" y="351" font-size="11" fill="#4a5563">loop sense</text>
  </g>

  <!-- wires -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round">
    <!-- D10 -> pin1 RESET -->
    <path d="M366 195 L 470 195 L 470 198 L 590 198" stroke="#d17a00"/>
    <!-- D11 MOSI -> pin5 -->
    <path d="M366 245 L 450 245 L 450 520 L 920 520 L 920 378 L 780 378" stroke="#2c8a3c"/>
    <!-- D12 MISO -> pin6 -->
    <path d="M366 295 L 430 295 L 430 540 L 945 540 L 945 318 L 780 318" stroke="#7b3fa0"/>
    <!-- D13 SCK -> pin7 -->
    <path d="M366 345 L 410 345 L 410 560 L 970 560 L 970 258 L 780 258" stroke="#1f6fd1"/>
    <!-- 5V -> pin8 -->
    <path d="M366 395 L 490 395 L 490 140 L 800 140 L 800 198 L 780 198" stroke="#c62828"/>
    <!-- GND -> pin4 -->
    <path d="M366 445 L 520 445 L 520 378 L 590 378" stroke="#222222"/>
  </g>
  <g font-size="12" font-weight="bold">
    <text x="378" y="188" fill="#d17a00">RESET</text>
    <text x="458" y="514" fill="#2c8a3c">MOSI → pin 5</text>
    <text x="600" y="534" fill="#7b3fa0">MISO → pin 6</text>
    <text x="700" y="554" fill="#1f6fd1">SCK → pin 7</text>
    <text x="560" y="134" fill="#c62828">5 V → pin 8</text>
    <text x="378" y="466" fill="#222222">GND → pin 4</text>
  </g>

  <!-- notes -->
  <g font-size="12" fill="#4a5563">
    <text x="60" y="600">After the fuses select the crystal (Burn Bootloader), the chip only runs and programs with an 8 MHz crystal on pins 2–3:</text>
    <text x="60" y="617">X1 on the board is enough. A bare chip in a ZIF adapter needs a crystal (+ 2 × 18–22 pF) added to the adapter for every later upload.</text>
  </g>
</svg>

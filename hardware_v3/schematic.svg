<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" font-family="'DejaVu Sans',Arial,sans-serif" font-size="13">
  <rect width="1160" height="700" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="bold">Pulse-to-Tone Converter rev V3 — battery-backup power section</text>
  <text x="24" y="50" font-size="12" fill="#555">CR1632 coin cell carries the ATtiny through pulse-dial gaps (option B). Q_batt = low-leakage P-MOS switch (MCU-controlled); D_rev = reverse-charge block.</text>

  <!-- ===== styles ===== -->
  <g stroke="#111" stroke-width="2" fill="none">
    <!-- Vc (loop clamp) rail -->
    <line x1="300" y1="130" x2="900" y2="130"/>
    <!-- VDD rail -->
    <line x1="560" y1="300" x2="900" y2="300"/>
    <!-- GND rail -->
    <line x1="120" y1="620" x2="1040" y2="620"/>
  </g>
  <text x="305" y="123" font-size="12" fill="#b00">Vc  (loop clamp ~5.0 V)</text>
  <text x="565" y="293" font-size="12" fill="#070">VDD  (MCU rail)</text>
  <text x="124" y="640" font-size="12" fill="#555">GND</text>

  <!-- ===== FXS bridge ===== -->
  <rect x="120" y="150" width="120" height="110" fill="#eef3fb" stroke="#111" stroke-width="2"/>
  <text x="180" y="195" text-anchor="middle" font-size="12">BAT46WH</text>
  <text x="180" y="212" text-anchor="middle" font-size="12">bridge</text>
  <text x="180" y="229" text-anchor="middle" font-size="12">D1–D4</text>
  <text x="112" y="145" text-anchor="end" font-size="12" transform="rotate(-90 70 205)"> </text>
  <text x="60" y="210" font-size="12" fill="#555">to FXS</text>
  <text x="60" y="226" font-size="12" fill="#555">(line)</text>
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="110" y1="180" x2="120" y2="180"/><line x1="110" y1="230" x2="120" y2="230"/>
    <line x1="240" y1="175" x2="270" y2="175"/><line x1="270" y1="175" x2="270" y2="130"/>   <!-- + to Vc -->
    <line x1="240" y1="235" x2="270" y2="235"/><line x1="270" y1="235" x2="270" y2="620"/>   <!-- - to GND -->
  </g>

  <!-- ===== shunt clamp ===== -->
  <rect x="330" y="160" width="150" height="70" fill="#fdf0ee" stroke="#111" stroke-width="2"/>
  <text x="405" y="188" text-anchor="middle" font-size="12">shunt clamp ~5.0 V</text>
  <text x="405" y="206" text-anchor="middle" font-size="11">TL431 U_sh + Q_sh</text>
  <text x="405" y="222" text-anchor="middle" font-size="10" fill="#555">(absorbs loop current)</text>
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="405" y1="130" x2="405" y2="160"/><line x1="405" y1="230" x2="405" y2="620"/>
  </g>

  <!-- C_vc reservoir -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="510" y1="130" x2="510" y2="235"/>
    <line x1="492" y1="235" x2="528" y2="235"/><line x1="496" y1="247" x2="524" y2="247"/>
    <line x1="510" y1="247" x2="510" y2="620"/>
  </g>
  <text x="534" y="245" font-size="11">C_vc 100µF</text>

  <!-- D_loop : Vc -> VDD -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="600" y1="130" x2="600" y2="300"/>
  </g>
  <polygon points="588,205 612,205 600,228" fill="#111"/>
  <line x1="588" y1="228" x2="612" y2="228" stroke="#111" stroke-width="2"/>
  <text x="618" y="212" font-size="11">D_loop</text>
  <text x="618" y="226" font-size="10" fill="#555">BAT46WH</text>

  <!-- C_dec on VDD -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="680" y1="300" x2="680" y2="360"/>
    <line x1="662" y1="360" x2="698" y2="360"/><line x1="666" y1="372" x2="694" y2="372"/>
    <line x1="680" y1="372" x2="680" y2="620"/>
  </g>
  <text x="704" y="368" font-size="11">C_dec 100µF</text>

  <!-- ATtiny -->
  <rect x="790" y="300" width="130" height="150" fill="#eef7ee" stroke="#111" stroke-width="2"/>
  <text x="855" y="372" text-anchor="middle" font-size="13" font-weight="bold">ATtiny85V</text>
  <text x="855" y="390" text-anchor="middle" font-size="12">U1</text>
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="855" y1="300" x2="855" y2="300"/>                 <!-- VCC pin to VDD rail -->
    <line x1="900" y1="320" x2="900" y2="300"/>                 <!-- VCC -->
    <line x1="855" y1="450" x2="855" y2="620"/>                 <!-- GND -->
    <line x1="790" y1="420" x2="690" y2="420"/>                 <!-- BATT_EN pin out left -->
  </g>
  <text x="905" y="318" font-size="10">VCC</text>
  <text x="840" y="470" font-size="10">GND</text>
  <text x="786" y="414" text-anchor="end" font-size="10">BATT_EN</text>
  <text x="786" y="428" text-anchor="end" font-size="9" fill="#555">(PB3)</text>

  <!-- ===== battery branch ===== -->
  <!-- CR1632 symbol -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="170" y1="470" x2="170" y2="490"/>
    <line x1="150" y1="490" x2="190" y2="490"/>          <!-- long (+) -->
    <line x1="160" y1="502" x2="180" y2="502"/>          <!-- short (-) -->
    <line x1="150" y1="514" x2="190" y2="514"/>
    <line x1="160" y1="526" x2="180" y2="526"/>
    <line x1="170" y1="526" x2="170" y2="620"/>          <!-- - to GND -->
  </g>
  <text x="196" y="496" font-size="11">CR1632 (+3.0 V)</text>
  <text x="196" y="512" font-size="10" fill="#555">off-board holder,</text>
  <text x="196" y="526" font-size="10" fill="#555">wire leads (THT pads)</text>
  <text x="150" y="464" text-anchor="middle" font-size="12" fill="#b00">+</text>

  <!-- BATT+ up to Q_batt source -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="170" y1="470" x2="170" y2="430"/><line x1="170" y1="430" x2="300" y2="430"/>
  </g>

  <!-- Q_batt P-FET -->
  <rect x="300" y="400" width="110" height="60" fill="#fff6e6" stroke="#111" stroke-width="2"/>
  <text x="355" y="425" text-anchor="middle" font-size="12">Q_batt</text>
  <text x="355" y="441" text-anchor="middle" font-size="10">P-MOS switch</text>
  <text x="300" y="396" font-size="9" fill="#555">S</text>
  <text x="402" y="396" font-size="9" fill="#555">D</text>
  <text x="358" y="474" font-size="9" fill="#555">G</text>

  <!-- D_rev : Q_batt drain -> VDD (reverse-charge block) -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="410" y1="430" x2="470" y2="430"/><line x1="470" y1="430" x2="470" y2="300"/>
  </g>
  <polygon points="458,372 482,372 470,349" fill="#111"/>
  <line x1="458" y1="349" x2="482" y2="349" stroke="#111" stroke-width="2"/>
  <text x="486" y="372" font-size="11">D_rev (PMEG)</text>
  <text x="486" y="386" font-size="10" fill="#555">reverse-charge block</text>

  <!-- gate pull-up + BATT_EN -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="355" y1="460" x2="355" y2="505"/>                 <!-- gate down -->
    <line x1="355" y1="505" x2="690" y2="505"/><line x1="690" y1="505" x2="690" y2="420"/> <!-- to BATT_EN -->
    <line x1="355" y1="490" x2="240" y2="490"/><line x1="240" y1="490" x2="240" y2="430"/> <!-- R_pu leg -->
  </g>
  <rect x="226" y="446" width="28" height="12" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="258" y="456" font-size="10">R_pu 1M → BATT+</text>
  <text x="470" y="520" font-size="10" fill="#555">BATT_EN: LOW = cell armed (dialing) · HIGH/float = cell off</text>

  <!-- ===== test points ===== -->
  <g font-size="11">
    <circle cx="560" cy="130" r="5" fill="#1763b8"/><text x="548" y="118" fill="#1763b8">TP1</text>
    <circle cx="740" cy="300" r="5" fill="#1763b8"/><text x="728" y="289" fill="#1763b8">TP2</text>
    <circle cx="170" cy="450" r="5" fill="#1763b8"/><text x="130" y="447" fill="#1763b8">TP3</text>
    <circle cx="560" cy="505" r="5" fill="#1763b8"/><text x="548" y="522" fill="#1763b8">TP4</text>
    <circle cx="440" cy="430" r="5" fill="#1763b8"/><text x="420" y="420" fill="#1763b8">TP5</text>
  </g>

  <!-- ===== test-point legend (sim voltages) ===== -->
  <rect x="610" y="560" width="520" height="120" fill="#f7f9fc" stroke="#1763b8"/>
  <text x="620" y="580" font-size="12" font-weight="bold" fill="#1763b8">Test-point voltages (from simulation) — verify on the bench</text>
  <g font-size="11">
    <text x="620" y="600">TP1 Vc  (loop clamp):   on-hook 0 V  ·  off-hook steady ~5.0 V  ·  gap: droops</text>
    <text x="620" y="618">TP2 VDD (MCU):          on-hook 0 V  ·  steady ~4.7 V  ·  in gap (armed) ~2.85 V  (&gt; 2.7 V BOD)</text>
    <text x="620" y="636">TP3 BATT+ (CR1632):     ~3.0 V always (replace when &lt; ~2.9 V OCV)</text>
    <text x="620" y="654">TP4 BATT_EN (gate):     ~3 V off-hook idle (off)  ·  ~0 V while dialing (cell armed)</text>
    <text x="620" y="672">TP5 cell branch:        0 V on-hook (isolated)  ·  ~3.0 V when armed</text>
  </g>
</svg>
